<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="Portal de acceso a la Mesa de Servicio."
  >
  <title>Mesa de Servicio | Inicio</title>
  <style>
    :root {
      --primary: #0f6fec;
      --primary-dark: #0b4fae;
      --navy: #102a43;
      --text: #243b53;
      --muted: #627d98;
      --surface: #ffffff;
      --background: #f3f6fb;
      --border: #e1e9f3;
      --teal: #0ea5a4;
      --shadow: 0 20px 55px rgba(16, 42, 67, 0.14);
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      margin: 0;
      padding: 22px;
      color: var(--text);
      background:
        radial-gradient(circle at 12% 8%, rgba(15, 111, 236, 0.08), transparent 28%),
        radial-gradient(circle at 88% 92%, rgba(14, 165, 164, 0.07), transparent 26%),
        var(--background);
      font-family: Inter, "Segoe UI", Arial, Helvetica, sans-serif;
      font-size: 14px;
      line-height: 1.5;
    }

    .access-card {
      position: relative;
      isolation: isolate;
      width: min(540px, 100%);
      overflow: hidden;
      padding: 34px 38px 32px;
      border: 1px solid var(--border);
      border-radius: 20px;
      background: var(--surface);
      box-shadow: var(--shadow);
      animation: card-in 0.55s ease both;
    }

    .access-card::before {
      position: absolute;
      top: 0;
      right: 0;
      left: 0;
      height: 4px;
      content: "";
      background: linear-gradient(90deg, var(--primary-dark), var(--primary), var(--teal));
    }

    .access-card::after {
      position: absolute;
      z-index: -1;
      top: -95px;
      right: -85px;
      width: 210px;
      height: 210px;
      border: 34px solid rgba(15, 111, 236, 0.045);
      border-radius: 50%;
      content: "";
      pointer-events: none;
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 18px;
      margin-bottom: 22px;
    }

    .service-icon {
      width: 48px;
      height: 48px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      border-radius: 14px;
      color: var(--primary);
      background: linear-gradient(145deg, #edf5ff, #e5f0ff);
      box-shadow: inset 0 0 0 1px rgba(15, 111, 236, 0.06);
    }

    .service-icon svg {
      width: 25px;
      height: 25px;
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 1.9;
      transition: transform 0.22s ease;
    }

    .access-card:hover .service-icon svg {
      transform: translateY(-1px) rotate(-3deg);
    }

    .eyebrow {
      margin: 0 0 7px;
      color: var(--primary);
      font-size: 11px;
      font-weight: 750;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: var(--navy);
      font-size: 27px;
      line-height: 1.2;
      letter-spacing: -0.5px;
    }

    .description {
      max-width: 430px;
      margin: 10px 0 18px;
      color: var(--muted);
      font-size: 14px;
    }

    .features {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin-bottom: 20px;
    }

    .feature {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
      padding: 8px;
      border: 1px solid #edf1f6;
      border-radius: 9px;
      color: #52708d;
      background: #f8fafc;
      font-size: 10.5px;
      font-weight: 650;
    }

    .feature svg {
      width: 14px;
      height: 14px;
      flex: 0 0 auto;
      fill: none;
      stroke: var(--teal);
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 2.2;
    }

    .login-button {
      width: 100%;
      min-height: 46px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      padding: 11px 18px;
      border-radius: 10px;
      color: #ffffff;
      background: linear-gradient(135deg, var(--primary), #168bea);
      box-shadow: 0 10px 22px rgba(15, 111, 236, 0.22);
      text-decoration: none;
      font-size: 14px;
      font-weight: 700;
      transition:
        transform 0.18s ease,
        box-shadow 0.18s ease,
        background 0.18s ease;
    }

    .login-button:hover {
      transform: translateY(-1px);
      background: linear-gradient(135deg, var(--primary-dark), var(--primary));
      box-shadow: 0 13px 26px rgba(15, 111, 236, 0.27);
    }

    .login-button:focus-visible {
      outline: 3px solid rgba(15, 111, 236, 0.22);
      outline-offset: 3px;
    }

    .login-button svg {
      width: 17px;
      height: 17px;
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 2;
      transition: transform 0.18s ease;
    }

    .login-button:hover svg {
      transform: translateX(3px);
    }

    .access-note {
      width: 100%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      margin: 18px 0 0;
      color: #71879d;
      font-size: 11px;
    }

    .access-note svg {
      width: 14px;
      height: 14px;
      fill: none;
      stroke: var(--teal);
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 2;
    }

    @keyframes card-in {
      from {
        opacity: 0;
        transform: translateY(12px) scale(0.985);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @media (max-width: 520px) {
      body {
        padding: 15px;
      }

      .access-card {
        padding: 31px 23px 28px;
        border-radius: 17px;
      }

      .card-header {
        margin-bottom: 20px;
      }

      h1 {
        font-size: 25px;
      }

      .features {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 350px) {
      body {
        display: block;
        padding: 0;
        background: #ffffff;
      }

      .access-card {
        min-height: 100vh;
        border: 0;
        border-radius: 0;
        box-shadow: none;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>
<body>
  <main class="access-card">
    <div class="card-header">
      <div class="service-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24">
          <path d="M4 5h16v11H7l-3 3z"></path>
          <path d="M8 9h8M8 12h5"></path>
        </svg>
      </div>
    </div>

    <p class="eyebrow">Portal de atención</p>
    <h1>Bienvenido a la Mesa de Servicio</h1>
    <p class="description">
      Ingrese con su cuenta para consultar y gestionar sus solicitudes.
    </p>

    <div class="features" aria-label="Funciones de la plataforma">
      <span class="feature">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="m5 12 4 4L19 6"></path>
        </svg>
        Solicitudes
      </span>
      <span class="feature">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="m5 12 4 4L19 6"></path>
        </svg>
        Seguimiento
      </span>
      <span class="feature">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="m5 12 4 4L19 6"></path>
        </svg>
        Comunicación
      </span>
    </div>

    <a class="login-button" href="login.html">
      Iniciar sesión
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M5 12h14M13 6l6 6-6 6"></path>
      </svg>
    </a>

    <p class="access-note">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <rect x="5" y="10" width="14" height="10" rx="2"></rect>
        <path d="M8 10V7a4 4 0 0 1 8 0v3"></path>
      </svg>
      Acceso exclusivo para usuarios autorizados
    </p>
  </main>
</body>
</html>
