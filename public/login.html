<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión | Mesa de Servicio</title>
  <style>
    :root {
      --primary: #0f6fec;
      --primary-dark: #0b4fae;
      --navy: #102a43;
      --text: #243b53;
      --muted: #627d98;
      --border: #e1e9f3;
      --surface: #ffffff;
      --background: #f3f6fb;
      --teal: #0ea5a4;
      --danger: #b42318;
      --danger-bg: #fff1f0;
      --danger-border: #fecdca;
      --success: #087443;
      --success-bg: #ecfdf3;
      --success-border: #abefc6;
      --shadow: 0 22px 58px rgba(16, 42, 67, 0.14);
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 28px;
      display: grid;
      place-items: center;
      overflow-x: hidden;
      font-family: Inter, "Segoe UI", Arial, Helvetica, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 12% 8%, rgba(15, 111, 236, 0.08), transparent 28%),
        radial-gradient(circle at 88% 92%, rgba(14, 165, 164, 0.07), transparent 26%),
        var(--background);
    }

    button,
    input {
      font: inherit;
    }

    .login-shell {
      position: relative;
      width: min(470px, 100%);
      overflow: hidden;
      border: 1px solid rgba(225, 233, 243, 0.9);
      border-radius: 22px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .login-shell::before {
      position: absolute;
      top: 0;
      right: 0;
      left: 0;
      height: 4px;
      content: "";
      background: linear-gradient(90deg, var(--primary-dark), var(--primary), var(--teal));
    }

    .form-panel {
      padding: 34px 42px 40px;
      background: var(--surface);
    }

    .back-link {
      width: fit-content;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 24px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .back-link:hover {
      color: var(--primary);
    }

    .back-link svg {
      width: 17px;
      height: 17px;
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 2;
    }

    .form-heading {
      margin-bottom: 24px;
    }

    .form-heading h1 {
      margin: 0 0 8px;
      color: var(--navy);
      font-size: 30px;
      line-height: 1.2;
      letter-spacing: -0.025em;
    }

    .form-heading p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.55;
    }

    .alerta {
      display: none;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 17px;
      padding: 12px 14px;
      border: 1px solid;
      border-radius: 10px;
      font-size: 13px;
      line-height: 1.45;
      text-align: left;
    }

    .alerta.visible {
      display: flex;
    }

    .alerta::before {
      width: 20px;
      height: 20px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      border-radius: 50%;
      color: #fff;
      font-size: 12px;
      font-weight: 800;
    }

    .alerta.error {
      border-color: var(--danger-border);
      color: var(--danger);
      background: var(--danger-bg);
    }

    .alerta.error::before {
      content: "!";
      background: #d92d20;
    }

    .alerta.exito {
      border-color: var(--success-border);
      color: var(--success);
      background: var(--success-bg);
    }

    .alerta.exito::before {
      content: "✓";
      background: #12b76a;
    }

    .field {
      margin-bottom: 17px;
    }

    .field label {
      display: block;
      margin-bottom: 8px;
      color: var(--text);
      font-size: 14px;
      font-weight: 700;
    }

    .input-wrap {
      position: relative;
    }

    .input-icon {
      position: absolute;
      top: 50%;
      left: 15px;
      width: 19px;
      height: 19px;
      pointer-events: none;
      transform: translateY(-50%);
      fill: none;
      stroke: #829ab1;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 1.8;
    }

    .input-wrap input {
      width: 100%;
      height: 47px;
      padding: 0 44px;
      outline: none;
      border: 1px solid #cbd8e6;
      border-radius: 10px;
      color: var(--navy);
      background: #fbfdff;
      transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    }

    .input-wrap input::placeholder {
      color: #9fb3c8;
    }

    .input-wrap input:focus {
      border-color: var(--primary);
      background: #fff;
      box-shadow: 0 0 0 4px rgba(15, 111, 236, 0.10);
    }

    .input-wrap:focus-within .input-icon {
      stroke: var(--primary);
    }

    .password-toggle {
      position: absolute;
      top: 50%;
      right: 9px;
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      padding: 0;
      transform: translateY(-50%);
      border: 0;
      border-radius: 8px;
      color: #627d98;
      background: transparent;
      cursor: pointer;
    }

    .password-toggle:hover {
      color: var(--primary);
      background: #edf5ff;
    }

    .password-toggle:focus-visible {
      outline: 3px solid rgba(15, 111, 236, 0.20);
    }

    .password-toggle svg {
      width: 19px;
      height: 19px;
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 1.9;
    }

    .submit-button {
      width: 100%;
      min-height: 48px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      margin-top: 5px;
      padding: 12px 20px;
      border: 0;
      border-radius: 10px;
      color: #fff;
      background: linear-gradient(135deg, var(--primary), #168bea);
      box-shadow: 0 10px 22px rgba(15, 111, 236, 0.22);
      cursor: pointer;
      font-weight: 700;
      transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    }

    .submit-button:hover {
      transform: translateY(-1px);
      background: linear-gradient(135deg, var(--primary-dark), var(--primary));
      box-shadow: 0 13px 26px rgba(15, 111, 236, 0.28);
    }

    .submit-button:focus-visible {
      outline: 3px solid rgba(15, 111, 236, 0.24);
      outline-offset: 3px;
    }

    .submit-button:disabled {
      cursor: wait;
      opacity: 0.72;
      transform: none;
    }

    .submit-button svg {
      width: 18px;
      height: 18px;
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 2;
    }

    .register {
      margin: 23px 0 0;
      color: var(--muted);
      font-size: 14px;
      text-align: center;
    }

    .register a {
      color: var(--primary);
      font-weight: 700;
      text-decoration: none;
    }

    .register a:hover {
      color: var(--primary-dark);
      text-decoration: underline;
    }

    @media (max-width: 500px) {
      body {
        padding: 16px;
      }

      .login-shell {
        border-radius: 18px;
      }

      .form-panel {
        padding: 28px 23px 32px;
      }

      .back-link {
        margin-bottom: 22px;
      }

      .form-heading h1 {
        font-size: 27px;
      }
    }

    @media (max-width: 360px) {
      body {
        display: block;
        padding: 0;
        background: #fff;
      }

      .login-shell {
        min-height: 100vh;
        border: 0;
        border-radius: 0;
        box-shadow: none;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="login-shell">
    <section class="form-panel">
      <a class="back-link" href="index.html">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="m15 18-6-6 6-6"/>
        </svg>
        Volver al inicio
      </a>

      <div class="form-heading">
        <h1>Iniciar sesión</h1>
        <p>Ingrese con sus credenciales para acceder a la Mesa de Servicio.</p>
      </div>

      <div id="mensajeError" class="alerta error" role="alert" aria-live="assertive"></div>
      <div id="mensajeEstado" class="alerta exito" role="status" aria-live="polite"></div>

      <form id="formLogin" action="login.php" method="POST" autocomplete="on">
        <div class="field">
          <label for="email">Correo electrónico</label>
          <div class="input-wrap">
            <svg class="input-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 5h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2Z"/>
              <path d="m22 7-10 6L2 7"/>
            </svg>
            <input
              id="email"
              type="text"
              name="email"
              autocomplete="username"
              maxlength="190"
              autocapitalize="none"
              spellcheck="false"
              placeholder="nombre@correo.com"
              required
            >
          </div>
        </div>

        <div class="field">
          <label for="password">Contraseña</label>
          <div class="input-wrap">
            <svg class="input-icon" viewBox="0 0 24 24" aria-hidden="true">
              <rect width="18" height="11" x="3" y="11" rx="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
            <input
              id="password"
              type="password"
              name="password"
              autocomplete="current-password"
              placeholder="Ingrese su contraseña"
              required
            >
            <button
              id="mostrarPassword"
              class="password-toggle"
              type="button"
              aria-label="Mostrar contraseña"
              aria-pressed="false"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/>
                <circle cx="12" cy="12" r="2.5"/>
              </svg>
            </button>
          </div>
        </div>

        <button id="botonIngresar" class="submit-button" type="submit">
          <span>Ingresar</span>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M5 12h14M13 6l6 6-6 6"/>
          </svg>
        </button>
      </form>
    </section>
  </main>

  <script>
    const mensajes = {
      campos: 'Ingrese el correo electrónico o usuario y la contraseña.',
      credenciales: 'El usuario, correo o contraseña son incorrectos.',
      sesion_inhabilitada: 'Su sesión fue cerrada porque el usuario fue inhabilitado.',
      sesion_expirada: 'La sesión expiró por seguridad. Ingrese nuevamente.',
      inactividad: 'La sesión se cerró tras 5 minutos sin interacción.',
      tiempo_maximo: 'La sesión alcanzó el límite de seguridad de 30 minutos. Ingrese nuevamente.',
      demasiados_intentos: 'Se alcanzó el límite de intentos. Espere 15 minutos antes de volver a ingresar.',
      acceso_denegado: 'No tiene permisos para acceder al panel solicitado.',
      rol: 'El usuario no tiene un rol válido asignado.',
      sistema: 'No fue posible iniciar sesión. Intente nuevamente.'
    };

    const parametros = new URLSearchParams(window.location.search);
    const codigoError = parametros.get('error');
    const estadoSesion = parametros.get('sesion');
    const contenedorError = document.getElementById('mensajeError');
    const contenedorEstado = document.getElementById('mensajeEstado');

    if (codigoError && mensajes[codigoError]) {
      const mensaje = mensajes[codigoError];
      contenedorError.textContent = mensaje;
      contenedorError.classList.add('visible');

      if (codigoError === 'inhabilitado' || codigoError === 'sesion_inhabilitada') {
        window.alert('Aviso: ' + mensaje);
      }
    }

    if (estadoSesion === 'cerrada') {
      contenedorEstado.textContent = 'Su sesión fue cerrada correctamente.';
      contenedorEstado.classList.add('visible');
    }

    if (codigoError || estadoSesion) {
      window.history.replaceState(null, document.title, window.location.pathname);
    }

    const campoPassword = document.getElementById('password');
    const botonPassword = document.getElementById('mostrarPassword');

    botonPassword.addEventListener('click', function () {
      const mostrar = campoPassword.type === 'password';
      campoPassword.type = mostrar ? 'text' : 'password';
      botonPassword.setAttribute('aria-pressed', String(mostrar));
      botonPassword.setAttribute(
        'aria-label',
        mostrar ? 'Ocultar contraseña' : 'Mostrar contraseña'
      );
      campoPassword.focus();
    });

    document.getElementById('formLogin').addEventListener('submit', function () {
      const boton = document.getElementById('botonIngresar');
      boton.disabled = true;
      boton.querySelector('span').textContent = 'Ingresando...';
    });
  </script>
</body>
</html>
