services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: mesa-n8n-local
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      TZ: America/Bogota
      GENERIC_TIMEZONE: America/Bogota
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://localhost:5678/
      N8N_SECURE_COOKIE: "false"
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
    volumes:
      - mesa_n8n_data:/home/node/.n8n
    depends_on:
      mailpit:
        condition: service_started

  mailpit:
    image: axllent/mailpit:v1.27
    container_name: mesa-mailpit-local
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"
    environment:
      TZ: America/Bogota
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: 500
    volumes:
      - mesa_mailpit_data:/data

volumes:
  mesa_n8n_data:
  mesa_mailpit_data:
